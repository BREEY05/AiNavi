<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智航AI协会</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="home">
  <div class="blue-rings ring-left" aria-hidden="true"></div>
  <div class="blue-rings ring-right" aria-hidden="true"></div>

  <div class="site-shell">
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="智航AI协会首页">
        <span class="brand-logo" data-logo></span>
        <span data-text="siteName">智航AI协会</span>
      </a>

      <nav class="main-nav" aria-label="主导航">
        <a class="active" href="index.html">首页</a>
        <a href="about.html">关于我们</a>
        <a href="members.html">社团风采</a>
        <a href="projects.html">项目展示</a>
        <a href="activities.html">近期活动</a>
        <a href="join.html">加入我们</a>
      </nav>

      <button class="secret-logo-button" type="button" data-secret-login aria-label="隐藏入口">
        <span class="brand-logo" data-logo></span>
      </button>

      <button class="menu-button" type="button" data-menu-toggle aria-label="展开导航">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </header>

    <main>
      <section class="hero-card">
        <img class="hero-background" data-image="heroImage" alt="协会主视觉">
        <div class="hero-pattern" aria-hidden="true"></div>
        <div class="hero-copy">
          <svg class="star-doodle" viewBox="0 0 80 80" aria-hidden="true"><path d="m40 6 8.7 24.1L74 39.5 49.2 49.7 40 74 30.8 49.7 6 39.5l25.3-9.4L40 6Z"/></svg>
          <svg class="plane-doodle" viewBox="0 0 90 70" aria-hidden="true"><path d="M7 34 80 5 54 62 39 42 7 34Z"/><path d="m39 42 41-37"/><path d="M8 55c14 8 30 5 42-9"/></svg>
          <h1 data-text="heroTitle">智航AI协会</h1>
          <p class="hero-subtitle" data-text="heroSubtitle">探索人工智能的无限可能</p>
          <p class="hero-line" data-text="heroLine">学习 · 实践 · 分享 · 成长</p>
        </div>
      </section>

      <section class="top-grid">
        <article class="panel notice-panel">
          <div class="panel-head">
            <div class="panel-title">
              <span class="panel-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13V9l10-4v12L4 13Z"/><path d="M14 8h2a3 3 0 0 1 0 6h-2M6 13l1.2 5H10l-1.5-4.4"/></svg>
              </span>
              <h2>最新公告</h2>
            </div>
            <button class="more-link" type="button" data-open-list="announcements">更多 <span>→</span></button>
          </div>
          <div class="notice-list" data-list="announcements"></div>
        </article>

        <article class="panel intro-panel">
          <div class="panel-head">
            <div class="panel-title">
              <span class="panel-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11a4 4 0 1 1 8 0"/><path d="M4 20a8 8 0 0 1 16 0"/><path d="M17 7a3 3 0 0 1 3 3M4 10a3 3 0 0 1 3-3"/></svg>
              </span>
              <h2>社团介绍</h2>
            </div>
          </div>
          <p data-text="clubIntro"></p>
          <div class="feature-row" data-list="features"></div>
        </article>

        <article class="panel activity-panel">
          <div class="panel-head">
            <div class="panel-title">
              <span class="panel-icon">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3v4M17 3v4M4 9h16M5 5h14v15H5Z"/><path d="M8 13h3M13 13h3M8 17h3"/></svg>
              </span>
              <h2>近期活动</h2>
            </div>
            <button class="more-link" type="button" data-open-list="activities">更多 <span>→</span></button>
          </div>
          <div class="activity-list" data-list="activities"></div>
        </article>
      </section>

      <section class="achievement-section">
        <div class="section-head">
          <div class="panel-title">
            <span class="panel-icon">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 5 6v5c0 4.5 3 8.5 7 10 4-1.5 7-5.5 7-10V6Z"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg>
            </span>
            <h2>成果展示</h2>
          </div>
          <a href="projects.html">查看更多 <span>→</span></a>
        </div>
        <div class="achievement-grid" data-list="home-projects"></div>
      </section>
    </main>
  </div>

  <div class="detail-modal" data-detail-modal hidden>
    <article class="detail-card">
      <button class="close-button" type="button" data-close-detail aria-label="关闭">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div data-detail-content></div>
    </article>
  </div>

  <script src="site-data.js"></script>
  <script src="main.js"></script>
</body>
</html>
