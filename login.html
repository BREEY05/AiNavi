<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理入口 - 智航AI协会</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <a class="auth-brand" href="index.html"><span class="brand-logo" data-auth-logo></span><span>智航AI协会</span></a>
    <section class="auth-panel" aria-labelledby="auth-title">
      <div class="auth-heading"><span>ADMIN PORTAL</span><h1 id="auth-title">后台管理入口</h1><p>使用 QQ 号注册并完成邮箱验证。新账号需等待所有者审批。</p></div>
      <div class="auth-tabs" role="tablist"><button class="active" type="button" data-auth-tab="login">登录</button><button type="button" data-auth-tab="register">注册管理员账号</button></div>
      <form data-auth-form="login" class="auth-form">
        <label>QQ号<input name="qq" inputmode="numeric" autocomplete="username" maxlength="12" required></label>
        <label>密码<input name="password" type="password" autocomplete="current-password" minlength="8" required></label>
        <button class="primary-button" type="submit">登录后台</button>
      </form>
      <form data-auth-form="register" class="auth-form" hidden>
        <label>QQ号<input name="qq" inputmode="numeric" autocomplete="username" maxlength="12" required></label>
        <label>设置密码<input name="password" type="password" autocomplete="new-password" minlength="8" required></label>
        <label class="code-field" hidden>邮箱验证码<input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6"></label>
        <button class="primary-button" type="submit">发送注册验证码</button>
        <button class="auth-resend ghost-button" type="button" data-resend-code hidden>重新发送验证码</button>
      </form>
      <p class="auth-message" data-auth-message aria-live="polite"></p>
    </section>
    <p class="auth-note">注册验证码将发送至 QQ号@qq.com，每次发送间隔至少 60 秒。</p>
  </main>
  <script src="site-data.js"></script>
  <script src="auth.js"></script>
</body>
</html>
